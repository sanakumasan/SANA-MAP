<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SANA MAP</title>
  
  <!-- PWAの設定ファイル -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- LeafletのCSS (必ずJSより先に読み込む) -->
  <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- 独自のCSS -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- 1. 地図を表示するコンテナ (これが最背面になります) -->
  <div id="map"></div>

  <!-- 2. 上部検索バー -->
  <div class="top-bar">
    <input type="text" id="search-input" placeholder="場所を検索（例：東京駅）">
    <button id="current-location-btn" class="dark-btn">現在地</button>
  </div>

  <!-- 3. 下部ナビゲーションバー -->
  <div class="bottom-bar">
    <button id="list-btn" class="white-btn">📋 保存一覧</button>
    <button id="add-pin-btn" class="dark-btn">📍 ピンを追加</button>
    <button id="backup-btn" class="white-btn">📥 バックアップ</button>
  </div>

  <!-- LeafletのJavaScript -->
  <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- 独自のJavaScript -->
  <script src="./app.js"></script>
</body>
</html>
